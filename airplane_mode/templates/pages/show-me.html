
{% block page_content %}
<div class="color-box-wrapper">
    <div class="color-box"></div>
</div>
{% endblock %}

{% block style %}
<style>
    .color-box-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }
    .color-box {
        width: 400px;
        height: 300px;
        background-color: {{ frappe.form_dict.color or 'black' }};
        border: 2px solid #333;
        border-radius: 8px;
    }
</style>
{% endblock %}
